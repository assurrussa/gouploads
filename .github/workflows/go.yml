# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master", "release/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tests-service
          POSTGRES_PASSWORD: tests-service
          POSTGRES_DB: tests-db-pgsql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests-service -d tests-db-pgsql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Set GOPRIVATE
        run: go env -w GOPRIVATE=github.com/assurrussa

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
        env:
          GOPRIVATE: "github.com/assurrussa"

      - name: Build
        run: go build -v ./...

      - name: Test Race
        run: go test -race -v ./...

      - name: Test durable TUS PostgreSQL fencing
        run: go test -tags integration ./domain/files/service/tusupload -run TestIntegration_PostgresSessionRepository -count=1
        env:
          TEST_PSQL_ADDRESS_LOCAL: 127.0.0.1
          TEST_PSQL_PORT_LOCAL: 5432
