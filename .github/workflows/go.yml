# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master", "release/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Set GOPRIVATE
        run: go env -w GOPRIVATE=github.com/assurrussa

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
        env:
          GOPRIVATE: "github.com/assurrussa"

      - name: Reusable Boundary
        run: make release-readiness

      - name: Build
        run: go build -v ./...

      - name: Test Race
        run: go test -race -v ./...
