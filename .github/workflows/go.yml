name: Go

on:
  push:
    branches: [master, 'release/*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gouploads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.1
  GOPRIVATE: ''
  GOCACHE: ${{ github.workspace }}/.go-cache/gocache
  GOMODCACHE: ${{ github.workspace }}/.go-cache/gomodcache
  GOPATH: ${{ github.workspace }}/.go-cache/gopath

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Check declared toolchain
        run: test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover -covermode=atomic -count=1 ./...
      - run: make test-surface externalconsumer-local anonymous-source

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: Verify configured formatting
        run: |
          golangci-lint fmt
          git diff --exit-code

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tests-service
          POSTGRES_PASSWORD: tests-service
          POSTGRES_DB: tests-db-pgsql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tests-service -d tests-db-pgsql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PSQL_ADDRESS_LOCAL: 127.0.0.1
      TEST_PSQL_PORT_LOCAL: '5432'
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: minioadmin
      TEST_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Start isolated S3 fixture
        run: |
          docker run -d --name gouploads-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs gouploads-minio
          exit 1
      - run: make test-surface-integration
      - run: go test -race -tags=integration ./domain/files/repositories/filerepo -count=1
      - run: make test-tus-postgres-integration test-source-url-s3-integration
      - run: make test-portable-media-e2e test-originals-integration
      - name: Fixture logs and shutdown
        if: always()
        run: |
          docker logs gouploads-minio || true
          docker rm -f gouploads-minio || true
